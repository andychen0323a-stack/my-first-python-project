name: 體育AI 每日自動化運算

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 發給機器人寫入權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載您的最新程式碼
        uses: actions/checkout@v4

      - name: ⚙️ 架設 Python 雲端環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝必備套件 (包含 AI 與視覺化套件)
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 schedule streamlit scikit-learn plotly

      - name: 🕷️ 執行情報爬蟲 (抓取最新傷兵)
        run: python scraper.py

      - name: 🧮 執行精算大腦 (計算凱利資金)
        run: python prediction.py

      - name: ☁️ 將最新報表存回 GitHub 並更新手機 App
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "🤖 自動排程：今日賽事與資金配比更新" || echo "今天沒有新資料需要更新"
          git push