name: 體育AI 每日自動化運算

# 設定觸發時間 (這是最重要的部分)
on:
  schedule:
    # 每天早上 8 點 (台灣時間 UTC+8) 自動執行。在 UTC 標準時間是凌晨 0 點。
    - cron: '0 0 * * *'
  # 允許我們在 GitHub 網頁上手動點擊測試
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載您的最新程式碼
        uses: actions/checkout@v3

      - name: ⚙️ 架設 Python 雲端環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 安裝必備套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 schedule streamlit

      - name: 🕷️ 執行情報爬蟲 (抓取最新傷兵)
        run: python scraper.py

      - name: 🧮 執行精算大腦 (計算凱利資金)
        run: python prediction.py

      - name: ☁️ 將最新報表存回 GitHub 並更新手機 App
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "🤖 自動排程：今日賽事與資金配比更新" || echo "今天沒有新資料需要更新"
          git push